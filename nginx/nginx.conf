server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
		try_files $uri $uri/ /index.html;
    }

	# location /mypath/ {
    #     alias   /usr/share/nginx/html/;  # Alias para la ruta física real
    #     index   index.html index.htm;
    #     try_files $uri $uri/ /mypath/index.html;  # Redirige a index.html si no se encuentra el archivo
    # }

	location /metrics-front {
		stub_status;
	}

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}

server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    server_name  localhost;

    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

	# location /mypath/ {
    #     alias   /usr/share/nginx/html/;  # Alias para la ruta física real
    #     index   index.html index.htm;
    #     try_files $uri $uri/ /mypath/index.html;  # Redirige a index.html si no se encuentra el archivo
    # }

    location /metrics-front {
        stub_status;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

